name: CI

# ⚠ PAIRED FILE: .gitlab-ci.yml
# `origin` is GitHub and GitLab is a mirror. Both assert the same things and must be changed
# together; if they drift, the two platforms disagree about whether the same commit is good.
#
# The php-runtime image is published by .github/workflows/php-runtime.yml, to GHCR, for both
# architectures. It used to come from the GitLab registry, built by hand — one architecture, the
# builder's — and this job failed on every run with "no matching manifest for linux/amd64".
#
# Consumed here, never rebuilt: a 29-52 minute extension compile must not run again per commit.
# Pinned by tag rather than digest because a container image reference here is resolved once per
# run and a wrong one fails loudly; the *service* image pins the digest, which is what ships.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/wildanfrananda/kinetix-review-php-runtime:php8.5-grpc1
    steps:
      # Composer, git and unzip are deliberately NOT in the runtime image: it ships to production, and
      # docker/php-runtime.Dockerfile installs git only to compile the extensions and purges it again.
      # So the job that needs build tooling installs it, rather than the image carrying it for everyone.
      # Without this the run died on `composer: not found` (exit 127) the moment the container finally
      # started, and checkout fell back to the REST API for want of git.
      #
      # The installer is checksum-verified against Composer's published signature: this fetches an
      # executable over the network into a job that then runs it.
      - name: Build tooling the runtime image does not carry
        run: |
          apt-get update
          apt-get install --no-install-recommends -y git unzip
          curl -sSLo /tmp/composer-setup.php https://getcomposer.org/installer
          expected="$(curl -sSL https://composer.github.io/installer.sig)"
          actual="$(php -r 'echo hash_file("sha384", "/tmp/composer-setup.php");')"
          test "$expected" = "$actual" || { echo "composer installer checksum mismatch"; exit 1; }
          php /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer --quiet
          rm /tmp/composer-setup.php
          composer --version

      - uses: actions/checkout@v6
      - name: Install dependencies
        # `.env.testing` is committed and carries everything the suite needs.
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Lint
        run: ./vendor/bin/pint --test
      - name: Pest
        run: |
          php vendor/bin/pest --colors=never
          # A suite that runs no tests is a failed suite, not a passing one.
          count=$(php vendor/bin/pest --colors=never 2>&1 | sed -n 's/.*Tests:.*[^0-9]\([0-9][0-9]*\) passed.*/\1/p' | tail -1)
          echo "executed ${count:-0} tests"
          test "${count:-0}" -ge 15 || { echo "expected at least 15 tests, ran ${count:-0}"; exit 1; }

  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build the service image
        run: |
          test -f .dockerignore || { echo "no .dockerignore — the build context would carry .env and .git"; exit 1; }
          docker build -t kinetix-review-service:ci .
      - name: The image must not run as root
        run: |
          uid=$(docker run --rm --entrypoint sh kinetix-review-service:ci -c 'id -u')
          test "$uid" != "0" || { echo "image runs as root"; exit 1; }
          echo "runs as uid $uid"
