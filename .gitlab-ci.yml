# Kinetix review CI — GitLab.
#
# ⚠ PAIRED FILE: .github/workflows/ci.yml
# `origin` is GitHub and GitLab is a mirror. Both assert the same things and must be changed
# together; if they drift, the two platforms disagree about whether the same commit is good.
#
# This repository had no CI at all. Its suite had never run in a pipeline, and — as it turned
# out — could not run anywhere: `config/database.php` threw for missing Postgres credentials
# while building the *sqlite* connection, so every example errored before asserting anything.
#
# The php-runtime base image is the reason this file exists in this shape. Building the PECL grpc
# extension takes 29-52 minutes, and it was being rebuilt for edits that had nothing to do with
# it. It now lives in its own image, published only when its Dockerfile changes, and the service
# image starts from it by digest.
#
# That image is built by GitHub — .github/workflows/php-runtime.yml — and not here. The job that
# used to build it in this file pushed whatever architecture the runner happened to be, which is
# how an arm64-only image reached a registry and broke every amd64 build that consumed it. One
# builder, two architectures, one manifest list; this file consumes the result like any other job.

include:
  - project: 'WildanFrananda/kinetix-infrastructure'
    ref: main
    file: '/ci/service-ci.yml'

stages:
  - verify
  - build
  - test

.php:
  # GHCR, and public, so this pulls with no credentials — GitLab needs no token for it.
  image: ghcr.io/wildanfrananda/kinetix-review-php-runtime:php8.5-grpc1
  variables:
    APP_ENV: testing
  before_script:
    # Composer, git and unzip are deliberately absent from the runtime image — it ships to production,
    # and docker/php-runtime.Dockerfile purges git after compiling the extensions. The job that needs
    # build tooling installs it; the image does not carry it for everyone. Mirrors the same step in
    # .github/workflows/ci.yml, and the installer is checksum-verified there for the same reason.
    - apt-get update
    - apt-get install --no-install-recommends -y git unzip
    - curl -sSLo /tmp/composer-setup.php https://getcomposer.org/installer
    - |
      expected="$(curl -sSL https://composer.github.io/installer.sig)"
      actual="$(php -r 'echo hash_file("sha384", "/tmp/composer-setup.php");')"
      test "$expected" = "$actual" || { echo "composer installer checksum mismatch"; exit 1; }
    - php /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer --quiet
    - rm /tmp/composer-setup.php
    # No `cp .env.example .env`. `.env.testing` is committed and carries everything the suite
    # needs; writing a `.env` here would create the second source of truth that s2-gate forbids.
    # ext-sockets is declared by spiral/goridge for its socket relay; review-grpc's worker talks to
    # RoadRunner over pipes, which never touches it, and the runtime image does not carry it.
    - composer install --no-interaction --prefer-dist --no-progress --ignore-platform-req=ext-sockets

secret-scan:
  extends: .secret-scan

lint:
  extends: .php
  stage: verify
  script:
    - ./vendor/bin/pint --test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build-image:
  extends: .build-image

pest:
  extends: .php
  stage: test
  # The suite runs on Postgres, never SQLite: the review evidence log is an xid8 cursor and the
  # triggers that write and guard it. phpunit.xml names a throwaway database.
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: ci
    POSTGRES_PASSWORD: ci-ephemeral-not-a-deployed-credential
    POSTGRES_DB: kinetix_review_test
    DB_HOST: postgres
    DB_PORT: "5432"
  script:
    - php vendor/bin/pest --colors=never
    # A suite that runs no tests is a failed suite, not a passing one — which is exactly what
    # this repository would have reported for its whole life had a pipeline existed.
    - |
      count=$(php vendor/bin/pest --colors=never 2>&1 | sed -n 's/.*Tests:.*[^0-9]\([0-9][0-9]*\) passed.*/\1/p' | tail -1)
      echo "executed ${count:-0} tests"
      test "${count:-0}" -ge 15 || { echo "expected at least 15 tests, ran ${count:-0} — the suite is not being discovered"; exit 1; }
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# review-grpc's RoadRunner binary: the SPIFFE allow list and the call counter it carries.
rr:
  image: golang:1.26-bookworm@sha256:d9c68c2c51161e12fd77e4c6320687c9cd86e1af1e3ad6e6cd63ff970641453c
  stage: test
  variables:
    GOFLAGS: -buildvcs=false
  script:
    - cd rr
    - |
      unformatted="$(gofmt -l .)"
      test -z "$unformatted" || { echo "not gofmt-formatted: $unformatted"; exit 1; }
    - go vet ./...
    - go test -count=1 ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
