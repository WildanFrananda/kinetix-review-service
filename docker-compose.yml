# Secrets are read from the environment with the ${VAR:?message} form, which makes
# `docker compose` refuse to render at all when a value is missing rather than starting
# on a committed default (S1 / P0-SEC-02). Datastore ports are deliberately NOT published
# to the host: reach them from inside the compose network, or with `docker compose exec`.
version: "3.8"

services:
  kinetix-review-postgres:
    image: postgres:16-alpine
    container_name: kinetix-review-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: kinetix_review_dev
    volumes:
      - review_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  kinetix-review-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kinetix-review-service
    ports:
      - "8002:8002"
    env_file:
      - .env
    depends_on:
      kinetix-review-postgres:
        condition: service_healthy
    restart: always

volumes:
  review_postgres_data:
