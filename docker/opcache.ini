; OPcache ships enabled in php:8.5-fpm, but with development-shaped defaults. These are the
; production ones: the code in this image never changes at runtime, so there is no reason to
; stat every file on every request.
opcache.enable=1
opcache.enable_cli=0
opcache.validate_timestamps=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
